<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beatles Tone Lab</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/slice.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main id="app" class="era-1969-70">
      <header class="app-header">
        <h1>Beatles Tone Lab</h1>
        <p class="tagline">A tone museum you can play through. <span class="slice-note">Vertical slice · 1 preset · Listen Mode</span></p>
      </header>

      <section id="preset-card" class="preset-card" aria-live="polite"></section>

      <section class="controls">
        <div id="knobs" class="knobs" aria-label="Tone controls"></div>
        <div id="listen" class="listen"></div>
      </section>

      <p class="honest-limit">
        Play Mode (live guitar) needs desktop Chrome + an audio interface and arrives in a later milestone.
        This slice runs Listen Mode with a placeholder dry riff — no hardware needed.
      </p>

      <footer id="status-bar" class="status-bar" aria-label="Status"></footer>
    </main>
  </body>
</html>
