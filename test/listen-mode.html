<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Beatles Tone Lab — Listen Mode controller test</title>
    <style>
      body { font-family: ui-monospace, monospace; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      #result { font-size: 1.4rem; font-weight: 700; padding: 1rem; border-radius: 10px; }
      .pass { background: #e6f4ea; color: #137333; }
      .fail { background: #fce8e6; color: #b3261e; }
      pre { background: #f5f5f5; padding: 1rem; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Listen Mode controller</h1>
    <div id="result">running…</div>
    <pre id="detail"></pre>

    <script type="module">
      import { createListenMode } from '../src/ui/listenMode.js';

      const result = document.getElementById('result');
      const detail = document.getElementById('detail');
      const lines = [];

      function assert(condition, message) {
        if (!condition) throw new Error(message);
        lines.push('✓ ' + message);
      }

      function deferred() {
        let resolve;
        let reject;
        const promise = new Promise((res, rej) => {
          resolve = res;
          reject = rej;
        });
        return { promise, resolve, reject };
      }

      function fakeContext() {
        const sources = [];
        return {
          state: 'suspended',
          currentTime: 0,
          resumeCalls: 0,
          sources,
          resume() {
            this.resumeCalls += 1;
            this.state = 'running';
            return Promise.resolve();
          },
          createBufferSource() {
            const source = {
              buffer: null,
              loop: false,
              connected: null,
              starts: [],
              stops: 0,
              connect(node) { this.connected = node; },
              disconnect() { this.connected = null; },
              start(when, offset) { this.starts.push({ when, offset }); },
              stop() { this.stops += 1; },
            };
            sources.push(source);
            return source;
          },
        };
      }

      const presetA = { id: 'a', song: 'A', demoRiff: '/a.mp3' };
      const presetB = { id: 'b', song: 'B', demoRiff: '/b.mp3' };
      const input = {};

      try {
        // Start, cached resume, pause offset, and mode exclusivity.
        const ctx = fakeContext();
        let loads = 0;
        let playStops = 0;
        const prepared = [];
        const states = [];
        const controller = createListenMode(ctx, input, {
          loadBuffer: async () => {
            loads += 1;
            return { duration: 10 };
          },
          preparePreset: async (preset) => prepared.push(preset.id),
          stopPlayMode: () => { playStops += 1; },
          onStateChange: (state) => states.push(state.status),
        });

        await controller.start(presetA);
        assert(ctx.resumeCalls === 1, 'start resumes a suspended AudioContext');
        assert(controller.getState().status === 'playing', 'start publishes playing state');
        assert(ctx.sources[0].loop && ctx.sources[0].connected === input, 'source loops through engine input');
        assert(prepared.join(',') === 'a' && playStops === 1, 'preset prepares and Play Mode stops');

        ctx.currentTime = 3.25;
        assert(controller.pause(), 'pause succeeds while playing');
        assert(controller.getState().status === 'paused', 'pause publishes paused state');
        await controller.start(presetA);
        assert(loads === 1, 'decoded buffers are cached by URL');
        assert(ctx.sources[1].starts[0].offset === 3.25, 'resume starts from the paused offset');

        // A rejected load leaves retryable state and is not cached.
        const retryCtx = fakeContext();
        let retryLoads = 0;
        let surfaced = '';
        const retryController = createListenMode(retryCtx, input, {
          loadBuffer: async () => {
            retryLoads += 1;
            if (retryLoads === 1) throw new Error('decode failed');
            return { duration: 4 };
          },
          onError: (message) => { surfaced = message; },
        });
        await retryController.start(presetA);
        assert(retryController.getState().status === 'error' && surfaced.includes('decode failed'), 'decode failure is surfaced');
        await retryController.start(presetA);
        assert(retryLoads === 2 && retryController.getState().status === 'playing', 'retry performs a fresh load and recovers');

        // A slower stale selection cannot overwrite the final selection.
        const raceCtx = fakeContext();
        const pendingA = deferred();
        const pendingB = deferred();
        const racePrepared = [];
        const raceController = createListenMode(raceCtx, input, {
          loadBuffer: (_context, url) => url === '/a.mp3' ? pendingA.promise : pendingB.promise,
          preparePreset: async (preset) => racePrepared.push(preset.id),
        });
        const startA = raceController.start(presetA);
        const startB = raceController.start(presetB);
        pendingB.resolve({ duration: 5 });
        await startB;
        pendingA.resolve({ duration: 5 });
        await startA;
        assert(raceController.getState().presetId === 'b', 'latest rapid selection owns playback state');
        assert(racePrepared.join(',') === 'b' && raceCtx.sources.length === 1, 'stale selection never prepares or creates a source');

        result.textContent = 'PASS ✓';
        result.className = 'pass';
        detail.textContent = lines.join('\n');
        window.__listenModeTest = { pass: true, lines };
      } catch (error) {
        result.textContent = 'FAIL ✗';
        result.className = 'fail';
        detail.textContent = lines.join('\n') + '\n\n' + (error.stack || error);
        window.__listenModeTest = { pass: false, error: String(error), lines };
      }
    </script>
  </body>
</html>
