<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Beatles Tone Lab — Listen Mode controller test</title>
    <style>
      body { font-family: ui-monospace, monospace; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      #result { font-size: 1.4rem; font-weight: 700; padding: 1rem; border-radius: 10px; }
      .pass { background: #e6f4ea; color: #137333; }
      .fail { background: #fce8e6; color: #b3261e; }
      pre { background: #f5f5f5; padding: 1rem; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Listen Mode controller</h1>
    <div id="result">running…</div>
    <pre id="detail"></pre>

    <script type="module">
      import { runListenModeTests } from './listen-mode.test.mjs';

      const result = document.getElementById('result');
      const detail = document.getElementById('detail');
      let lines = [];

      try {
        lines = await runListenModeTests();

        result.textContent = 'PASS ✓';
        result.className = 'pass';
        detail.textContent = lines.join('\n');
        window.__listenModeTest = { pass: true, lines };
      } catch (error) {
        result.textContent = 'FAIL ✗';
        result.className = 'fail';
        detail.textContent = lines.join('\n') + '\n\n' + (error.stack || error);
        window.__listenModeTest = { pass: false, error: String(error), lines };
      }
    </script>
  </body>
</html>
