<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beatles Tone Lab</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/slice.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main id="app" class="era-1969-70">
      <div class="page">
        <header class="app-header">
          <h1>Beatles Tone Lab</h1>
          <p class="tagline">A tone museum you can play through.</p>

        <nav id="timeline" class="timeline"></nav>

    </main>
